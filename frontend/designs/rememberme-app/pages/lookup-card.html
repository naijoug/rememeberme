<!DOCTYPE html>
<html lang="zh-CN" class="light">

    <style id="theme-vars">
/* ============================================================
   Remember Me · Brand CSS (Free-Explore)
   Tone: 活力游戏化 · 记忆激励 (energetic, motivational, game-like)
   Single primary hue (warm ember orange) + neutral system.
   Light + Dark dual mode.
   Brand prefix: rm-
   ============================================================ */

:root {
  /* ---- Primary brand hue: ember orange (energy / streak / motivation) ---- */
  --rm-primary-50:  #FFF3EC;
  --rm-primary-100: #FFE2D1;
  --rm-primary-200: #FFC4A6;
  --rm-primary-300: #FFA176;
  --rm-primary-400: #FF8A52;
  --rm-primary-500: #FF7A3D;  /* core brand */
  --rm-primary-600: #ED5F22;
  --rm-primary-700: #C84A18;
  --rm-primary-800: #9E3A14;
  --rm-primary-900: #7A2E12;

  /* ---- Neutral scale (warm-tinted grays for cohesion) ---- */
  --rm-neutral-0:   #FFFFFF;
  --rm-neutral-50:  #FAF7F4;
  --rm-neutral-100: #F2EDE8;
  --rm-neutral-200: #E6DFD8;
  --rm-neutral-300: #D2C9C0;
  --rm-neutral-400: #A89E94;
  --rm-neutral-500: #7C7268;
  --rm-neutral-600: #5C534B;
  --rm-neutral-700: #423B35;
  --rm-neutral-800: #2A2521;
  --rm-neutral-900: #1A1613;

  /* ---- Semantic state colors (status only, not identity) ---- */
  --rm-state-success: #2FB67A;
  --rm-state-warning: #F2B23E;
  --rm-state-error:   #E5544B;
  --rm-state-info:    #4C8DD6;

  /* ---- Radius scale (restrained) ---- */
  --rm-radius-sm: 4px;
  --rm-radius-md: 8px;
  --rm-radius-lg: 16px;
  --rm-radius-full: 9999px;

  /* ---- Spacing base ---- */
  --rm-space-1: 4px;
  --rm-space-2: 8px;
  --rm-space-3: 12px;
  --rm-space-4: 16px;
  --rm-space-5: 24px;
  --rm-space-6: 32px;

  /* ---- Shadows (static surfaces <= 0.05 alpha) ---- */
  --rm-shadow-card: 0 1px 2px rgba(26, 22, 19, 0.04), 0 1px 1px rgba(26, 22, 19, 0.03);
  --rm-shadow-float: 0 12px 32px rgba(26, 22, 19, 0.16), 0 4px 12px rgba(26, 22, 19, 0.10);

  /* ============================================================
     LIGHT MODE (default) — semantic surface tokens
     ============================================================ */
  --rm-bg:            var(--rm-neutral-50);
  --rm-bg-elevated:   var(--rm-neutral-0);
  --rm-surface:       var(--rm-neutral-0);
  --rm-surface-soft:  var(--rm-neutral-100);
  --rm-surface-sunk:  var(--rm-neutral-100);
  --rm-border:        var(--rm-neutral-200);
  --rm-border-strong: var(--rm-neutral-300);

  --rm-text-strong:   var(--rm-neutral-900);
  --rm-text:          var(--rm-neutral-700);
  --rm-text-muted:    var(--rm-neutral-500);
  --rm-text-faint:    var(--rm-neutral-400);
  --rm-text-on-primary: #FFFFFF;

  --rm-primary:       var(--rm-primary-500);
  --rm-primary-hover: var(--rm-primary-600);
  --rm-primary-soft:  var(--rm-primary-50);
  --rm-primary-soft-border: var(--rm-primary-200);

  --rm-streak-bg:     var(--rm-primary-50);
  --rm-streak-fg:     var(--rm-primary-700);
}

/* ============================================================
   DARK MODE — applied via <html class="dark">
   ============================================================ */
.dark {
  --rm-bg:            #14110E;
  --rm-bg-elevated:   #1F1A16;
  --rm-surface:       #1F1A16;
  --rm-surface-soft:  #272019;
  --rm-surface-sunk:  #18130F;
  --rm-border:        #332B23;
  --rm-border-strong: #4A3F33;

  --rm-text-strong:   #FBF6F0;
  --rm-text:          #E0D6CB;
  --rm-text-muted:    #A09385;
  --rm-text-faint:    #6E6258;
  --rm-text-on-primary: #1A1613;

  --rm-primary:       var(--rm-primary-400);
  --rm-primary-hover: var(--rm-primary-300);
  --rm-primary-soft:  rgba(255, 122, 61, 0.14);
  --rm-primary-soft-border: rgba(255, 122, 61, 0.30);

  --rm-streak-bg:     rgba(255, 122, 61, 0.14);
  --rm-streak-fg:     var(--rm-primary-300);

  --rm-shadow-card: 0 1px 2px rgba(0, 0, 0, 0.30), 0 1px 1px rgba(0, 0, 0, 0.20);
  --rm-shadow-float: 0 12px 32px rgba(0, 0, 0, 0.55), 0 4px 12px rgba(0, 0, 0, 0.40);
}

/* ============================================================
   Typography system
   Display: Sora (geometric, energetic) · Body: Inter
   Numerals (counts/streaks): Sora for tabular punch.
   ============================================================ */
:root {
  --rm-font-display: 'Sora', 'Noto Sans SC', system-ui, sans-serif;
  --rm-font-body: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
}

.rm-display {
  font-family: var(--rm-font-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--rm-text-strong);
}
.rm-h1 { font-family: var(--rm-font-display); font-weight: 700; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; color: var(--rm-text-strong); }
.rm-h2 { font-family: var(--rm-font-display); font-weight: 700; font-size: 22px; line-height: 1.25; letter-spacing: -0.015em; color: var(--rm-text-strong); }
.rm-h3 { font-family: var(--rm-font-display); font-weight: 600; font-size: 17px; line-height: 1.3; color: var(--rm-text-strong); }
.rm-body { font-family: var(--rm-font-body); font-weight: 400; font-size: 15px; line-height: 1.55; color: var(--rm-text); }
.rm-body-sm { font-family: var(--rm-font-body); font-weight: 400; font-size: 13px; line-height: 1.5; color: var(--rm-text-muted); }
.rm-caption { font-family: var(--rm-font-body); font-weight: 500; font-size: 11px; line-height: 1.4; letter-spacing: 0.02em; color: var(--rm-text-faint); }
.rm-num { font-family: var(--rm-font-display); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

body { background-color: var(--rm-bg); color: var(--rm-text); font-family: var(--rm-font-body); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--rm-primary);
    --color-border: var(--rm-border);
  }
  @layer base {
    body { background: var(--rm-surface); color: var(--rm-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>

    <style>
      /* interaction polish — CSS-first, transform/opacity/color only */
      [data-dom-id="mark-remember"]:hover { background-color: var(--rm-primary-hover); }
      [data-dom-id="mark-forget"]:hover { background-color: var(--rm-surface-soft); }
      [data-dom-id="pronounce"]:hover { background-color: var(--rm-primary-hover); }
      button[data-dom-id]:focus-visible,
      button[aria-label]:focus-visible {
        outline: 2px solid var(--rm-primary);
        outline-offset: 2px;
      }
      /* selected word micro-cue: gentle pulse of the ember underline */
      @keyframes rm-select-cue {
        0%, 100% { box-shadow: inset 0 -2px 0 var(--rm-primary); }
        50% { box-shadow: inset 0 -3px 0 var(--rm-primary-hover); }
      }
      @media (prefers-reduced-motion: no-preference) {
        article .relative[style*="inset 0 -2px"] { animation: rm-select-cue 2.4s ease-in-out infinite; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
